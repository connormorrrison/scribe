name: Scribe
options:
  bundleIdPrefix: com.connormorrison
  deploymentTarget:
    iOS: "18.0"
targets:
  Scribe:
    type: application
    platform: iOS
    sources: [Scribe]
    scheme:
      testTargets: [ScribeTests]
    preBuildScripts:
      - name: Only Claude Sonnet 5.5
        script: '"$SRCROOT/scripts/check-model.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Scribe/Info.plist
      properties:
        UIAppFonts: [Caveat.ttf]
        NSMicrophoneUsageDescription: Scribe listens when you tap the agent, so you can talk to it instead of typing.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connormorrison.scribe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 9Q39KHPLZH
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ScribeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScribeTests]
    dependencies:
      - target: Scribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connormorrison.scribe.tests
        DEVELOPMENT_TEAM: 9Q39KHPLZH
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
